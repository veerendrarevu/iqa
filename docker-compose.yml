services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    volumes:
      - model_cache:/models
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  model_cache:
